<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WorkingDad Site</title>
  <style>
 @font-face {
  font-family: 'JMH HORROR';
  src: url('fonts/JMH-HORROR.otf') format('opentype');
}
    /* --- dust canvas styling --- */
    #dust-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    body > *:not(#dust-canvas) {
      position: relative;
      z-index: 1;
    }
    /* --- END ADD --- */
    body {
      background: 
        radial-gradient(rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.9)),
        url('interface.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      gap: 30px;
      color: white;
      overflow: hidden;
    }

    h1 {
  font-family: 'JMH HORROR', cursive;
  font-weight: bold;
  text-align: center;
  font-size: 90px;
  letter-spacing: 0.12em;
  -webkit-text-stroke: 1.5px black;
  color: #00aaff;
  text-shadow:
    0 0 10px #00aaff,
    0 0 20px #00aaff,
    0 0 30px #00aaff,
    0 0 40px #00aaff,
    0 0 50px #00aaff,
    0 0 60px #00aaff,
    0 0 70px #00aaff;
  margin: 0;
}

   h2 {
  font-family: 'JMH HORROR', cursive;
  font-weight: bold;
  text-align: center;
  font-size: 50px;
  letter-spacing: 0.1em;
  color: #00aaff;
  -webkit-text-stroke: 1px black;
  text-shadow:
    0 0 4px #00aaff,
    0 0 8px #00aaff;
  margin: 0;
}

select {
  font-family: 'JMH HORROR', cursive;
  font-size: 24px;
  -webkit-text-stroke: 0.5px black;
  padding: 12px 30px;
  border-radius: 8px;
  border: none;
  background-color: #007acc;
  color: white;
  cursor: pointer;
  letter-spacing: 0.05em;
  margin-top: 20px;
  min-width: 250px;
  box-shadow: 0 0 12px #005f99;
  transition: background-color 0.3s ease;
  text-shadow: none;
}
    select:hover {
      background-color: #005f99;
      box-shadow: 0 0 20px #003d66;
    }

    .continue-button {
      display: inline-block;
      margin-top: 40px;
      padding: 15px 50px;
      background-color: #cc0000;
      color: white; /* white text, no stroke */
      font-family: 'JMH HORROR', cursive;
      font-weight: bold;
      font-size: 32px;
      -webkit-text-stroke: 0.5px black;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(204, 0, 0, 0.9);
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      /* Removed text-stroke for clarity */
      text-shadow: none;
    }

    .continue-button:hover {
      background-color: #990000;
      box-shadow: 0 0 25px rgba(204, 0, 0, 1);
    }
  </style>
</head>
<body>

  <!-- canvas element, right after <body> opens -->
  <canvas id="dust-canvas"></canvas>
  
  <h1>WELCOME USERS</h1>
  <h2>PLEASE SELECT WISELY</h2>

  <select id="language-select" aria-label="Select language">
    <option value="nextpage.html">English</option>
    <option value="hindi.html">Hindi</option>
    <option value="urdu.html">Urdu</option>
    <option value="korean.html">Korean</option>
    <option value="spanish.html">Spanish</option>
  </select>

  <button id="continue-btn" class="continue-button">CONTINUE</button>

  <script>
    const continueBtn = document.getElementById('continue-btn');
    const languageSelect = document.getElementById('language-select');

    continueBtn.addEventListener('click', () => {
      const selectedPage = languageSelect.value;
      window.location.href = selectedPage;
    });
  </script>

  <!-- dust animation script, right before </body> -->
  <script>
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = Array.from({ length: 100 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      speedX: (Math.random() - 0.5) * 0.7,
      speedY: -Math.random() * 0.8 - 0.2,
      opacity: Math.random() * 0.5 + 0.1,
      color: Math.random() < 0.7 ? '0,170,255' : '204,0,0'   // 70/30 blue and red colour dust
    }));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;

ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fillStyle = `rgba(${p.color},${p.opacity})`;
ctx.fill();
});
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
  
</body>
</html>
