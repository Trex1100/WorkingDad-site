<body>
<div id="stage">

<!-- =========================================
     THREE.JS MODULES
     RoundedBoxGeometry provides curved edges.
========================================= -->
<script type="module">
import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { RoundedBoxGeometry } from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js";

/* =========================================
   6. SCENE AND CAMERA
========================================= */
const canvasHost = document.getElementById("cube-canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090a0d);

const camera = new THREE.PerspectiveCamera(
    36, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(5.4, 4.6, 7.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
canvasHost.appendChild(renderer.domElement);

/* =========================================
   7. NEUTRAL LIGHTING
   No yellow overhead spotlight.
========================================= */
scene.add(new THREE.AmbientLight(0xffffff, 1.7));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(4, 5, 6);
scene.add(keyLight);

const frontFill = new THREE.DirectionalLight(0xffffff, 1.15);
frontFill.position.set(-4, 2, 5);
scene.add(frontFill);

const blueFill = new THREE.PointLight(0x416bff, 9, 18);
blueFill.position.set(4, 1, -4);
scene.add(blueFill);

const neutralFill = new THREE.PointLight(0xffffff, 5, 16);
neutralFill.position.set(-5, 0, 2);
scene.add(neutralFill);

/* =========================================
   8. SATURATED RUBIK'S CUBE COLOURS
   >>> EDIT HERE: CHANGE THESE HEX COLOURS
========================================= */
const COLORS = {
    red:    0xff101b,
    orange: 0xff6500,
    yellow: 0xffe600,
    green:  0x00e85d,
    blue:   0x073cff,
    white:  0xffffff
};

/*
    The six colours are assigned to the six original faces.
    Each cubie keeps its own stickers as it rotates.
*/
function makeSticker(color) {
    return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.32,
        metalness: 0.01
    });
}

const blackPlastic = new THREE.MeshStandardMaterial({
    color: 0x242521,
    roughness: 0.48,
    metalness: 0.035
});

/* =========================================
   9. ROUNDED CUBELET GEOMETRY
========================================= */
const cubies = [];
const spacing = 1.015;
const cubieSize = 0.965;

const cubeGeometry = new RoundedBoxGeometry(
    cubieSize, cubieSize, cubieSize,
    4,       // Smoothness segments
    0.075    // Corner radius
);

const edgeGeometry = new THREE.EdgesGeometry(cubeGeometry);
const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x11120f,
    transparent: true,
    opacity: 0.7
});

/*
    Box face order:
    +X, -X, +Y, -Y, +Z, -Z
*/
function createCubie(x, y, z) {
    const materials = [
        x ===  1 ? makeSticker(COLORS.red)    : blackPlastic,
        x === -1 ? makeSticker(COLORS.orange) : blackPlastic,
        y ===  1 ? makeSticker(COLORS.yellow) : blackPlastic,
        y === -1 ? makeSticker(COLORS.white)  : blackPlastic,
        z ===  1 ? makeSticker(COLORS.blue)   : blackPlastic,
        z === -1 ? makeSticker(COLORS.green)  : blackPlastic
    ];

    const cubie = new THREE.Mesh(cubeGeometry, materials);

    cubie.position.set(
        x * spacing,
        y * spacing,
        z * spacing
    );

    cubie.userData.grid = { x, y, z };

    const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
    cubie.add(edges);

    scene.add(cubie);
    cubies.push(cubie);
}

for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
            createCubie(x, y, z);
        }
    }
}

/* =========================================
   10. APPLY EXACT QUARTER-TURN ROTATIONS
   Used to scramble the cube before display.
========================================= */
function rotateGridPosition(grid, axis, direction) {
    const { x, y, z } = grid;

    if (axis === "x") {
        return direction === 1
            ? { x, y: -z, z: y }
            : { x, y: z, z: -y };
    }

    if (axis === "y") {
        return direction === 1
            ? { x: z, y, z: -x }
            : { x: -z, y, z: x };
    }

    return direction === 1
        ? { x: -y, y: x, z }
        : { x: y, y: -x, z };
}

function applyInstantTurn(move) {
    const selected = cubies.filter(cubie =>
        cubie.userData.grid[move.axis] === move.layer
    );

    const rotationAxis = new THREE.Vector3(
        move.axis === "x" ? 1 : 0,
        move.axis === "y" ? 1 : 0,
        move.axis === "z" ? 1 : 0
    );

    const rotation = new THREE.Quaternion().setFromAxisAngle(
        rotationAxis,
        move.direction * Math.PI / 2
    );

    selected.forEach(cubie => {
        cubie.userData.grid = rotateGridPosition(
            cubie.userData.grid,
            move.axis,
            move.direction
        );

        cubie.position.set(
            cubie.userData.grid.x * spacing,
            cubie.userData.grid.y * spacing,
            cubie.userData.grid.z * spacing
        );

        // Rotate the cubie's sticker orientation as well.
        cubie.quaternion.premultiply(rotation);
        cubie.quaternion.normalize();
    });
}

/* =========================================
   11. SCRAMBLE BEFORE THE PAGE APPEARS
   >>> EDIT HERE: Increase 24 for more scrambling.
========================================= */
function scrambleStartingCube() {
    const axes = ["x", "y", "z"];
    const layers = [-1, 0, 1];

    let previousMove = null;

    for (let i = 0; i < 24; i++) {
        let move;

        do {
            move = {
                axis: axes[Math.floor(Math.random() * axes.length)],
                layer: layers[Math.floor(Math.random() * layers.length)],
                direction: Math.random() < 0.5 ? 1 : -1
            };
        } while (
            previousMove &&
            move.axis === previousMove.axis &&
            move.layer === previousMove.layer
        );

        applyInstantTurn(move);
        previousMove = move;
    }
}

scrambleStartingCube();

/* =========================================
   12. SOFT SHADOW
========================================= */
const shadowCanvas = document.createElement("canvas");
shadowCanvas.width = 256;
shadowCanvas.height = 256;

const shadowCtx = shadowCanvas.getContext("2d");
const shadowGradient = shadowCtx.createRadialGradient(
    128, 128, 8, 128, 128, 125
);

shadowGradient.addColorStop(0, "rgba(0,0,0,0.65)");
shadowGradient.addColorStop(0.45, "rgba(0,0,0,0.3)");
shadowGradient.addColorStop(1, "rgba(0,0,0,0)");

shadowCtx.fillStyle = shadowGradient;
shadowCtx.fillRect(0, 0, 256, 256);

const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 5),
    new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(shadowCanvas),
        transparent: true,
        depthWrite: false
    })
);

shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.9;
scene.add(shadow);

/* =========================================
   13. ANIMATED FACE-TURN ENGINE
========================================= */
const pivot = new THREE.Group();
scene.add(pivot);

let isTurning = false;
let activeTurn = null;
let moveQueue = [];
let solvingStarted = false;

const TURN_DURATION = 460;

function beginTurn(move, timestamp) {
    pivot.rotation.set(0, 0, 0);
    pivot.position.set(0, 0, 0);

    const selected = cubies.filter(cubie =>
        cubie.userData.grid[move.axis] === move.layer
    );

    selected.forEach(cubie => pivot.attach(cubie));

    activeTurn = {
        move,
        selected,
        start: timestamp,
        from: 0,
        to: move.direction * Math.PI / 2
    };

    isTurning = true;
}

function finishTurn() {
    const move = activeTurn.move;

    activeTurn.selected.forEach(cubie => {
        scene.attach(cubie);

        cubie.userData.grid = rotateGridPosition(
            cubie.userData.grid,
            move.axis,
            move.direction
        );

        cubie.position.set(
            cubie.userData.grid.x * spacing,
            cubie.userData.grid.y * spacing,
            cubie.userData.grid.z * spacing
        );

        // Keep orientation clean and aligned to quarter turns.
        const euler = new THREE.Euler().setFromQuaternion(
            cubie.quaternion, "XYZ"
        );

        euler.x = Math.round(euler.x / (Math.PI / 2)) * Math.PI / 2;
        euler.y = Math.round(euler.y / (Math.PI / 2)) * Math.PI / 2;
        euler.z = Math.round(euler.z / (Math.PI / 2)) * Math.PI / 2;

        cubie.quaternion.setFromEuler(euler);
    });

    pivot.rotation.set(0, 0, 0);
    activeTurn = null;
    isTurning = false;
}

function randomMove(previous = null) {
    const axes = ["x", "y", "z"];
    const layers = [-1, 0, 1];

    let move;

    do {
        move = {
            axis: axes[Math.floor(Math.random() * axes.length)],
            layer: layers[Math.floor(Math.random() * layers.length)],
            direction: Math.random() < 0.5 ? 1 : -1
        };
    } while (
        previous &&
        move.axis === previous.axis &&
        move.layer === previous.layer
    );

    return move;
}

function inverseMove(move) {
    return {
        axis: move.axis,
        layer: move.layer,
        direction: -move.direction
    };
}

/* =========================================
   14. BUTTON, COUNTDOWN AND FOOTNOTE
========================================= */
const button = document.getElementById("solve-button");
const timerPanel = document.getElementById("timer-panel");
const footnote = document.getElementById("footnote");

button.addEventListener("click", () => {
    if (solvingStarted) return;

    solvingStarted = true;
    button.classList.add("disappearing");

    setTimeout(() => {
        button.style.display = "none";
        timerPanel.classList.add("visible");
        footnote.classList.add("visible");
    }, 350);

    startCountdown();
    runAttempt();
});

/* =========================================
   15. 100-YEAR COUNTDOWN
========================================= */
let remainingSeconds = 36500 * 24 * 60 * 60;
let countdownInterval = null;

const daysElement = document.getElementById("days");
const hoursElement = document.getElementById("hours");
const minutesElement = document.getElementById("minutes");
const secondsElement = document.getElementById("seconds");

function renderCountdown() {
    daysElement.textContent = String(
        Math.floor(remainingSeconds / 86400)
    ).padStart(5, "0");

    hoursElement.textContent = String(
        Math.floor((remainingSeconds % 86400) / 3600)
    ).padStart(2, "0");

    minutesElement.textContent = String(
        Math.floor((remainingSeconds % 3600) / 60)
    ).padStart(2, "0");

    secondsElement.textContent = String(
        remainingSeconds % 60
    ).padStart(2, "0");
}

function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    remainingSeconds = 36500 * 24 * 60 * 60;
    renderCountdown();

    countdownInterval = setInterval(() => {
        if (remainingSeconds > 0) {
            remainingSeconds--;
            renderCountdown();
        } else {
            clearInterval(countdownInterval);
        }
    }, 1000);
}

// Reset if the page is restored from browser history.
window.addEventListener("pageshow", event => {
    if (event.persisted) location.reload();
});

/* =========================================
   16. ENDLESS SOLVING ATTEMPTS
========================================= */
function runAttempt() {
    if (!solvingStarted) return;

    const scramble = [];
    let previous = null;

    for (let i = 0; i < 8; i++) {
        const move = randomMove(previous);
        scramble.push(move);
        previous = move;
    }

    scramble.forEach(move => moveQueue.push(move));

    // Attempt to reverse most of the recent turns.
    const partialSolution = scramble
        .slice(0, -2)
        .reverse()
        .map(inverseMove);

    partialSolution.forEach(move => moveQueue.push(move));

    // Interrupt the attempt before it can finish.
    moveQueue.push(randomMove());
    moveQueue.push(randomMove());

    waitForAttemptEnd();
}

function waitForAttemptEnd() {
    if (!solvingStarted) return;

    if (!isTurning && moveQueue.length === 0) {
        runAttempt();
    } else {
        requestAnimationFrame(waitForAttemptEnd);
    }
}

/* =========================================
   17. MAIN RENDER LOOP
========================================= */
function animate(timestamp) {
    requestAnimationFrame(animate);

    const time = timestamp * 0.001;

    // Very subtle idle movement while waiting for the button.
    if (!solvingStarted) {
        scene.rotation.y = Math.sin(time * 0.22) * 0.025;
    }

    if (!isTurning && moveQueue.length > 0) {
        beginTurn(moveQueue.shift(), timestamp);
    }

    if (activeTurn) {
        const elapsed = timestamp - activeTurn.start;
        const progress = Math.min(elapsed / TURN_DURATION, 1);

        // Smooth acceleration and deceleration.
        const eased = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        pivot.rotation[activeTurn.move.axis] =
            activeTurn.from +
            (activeTurn.to - activeTurn.from) * eased;

        if (progress >= 1) {
            pivot.rotation[activeTurn.move.axis] = activeTurn.to;
            finishTurn();
        }
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================
   18. RESPONSIVE CAMERA
========================================= */
function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;

    if (window.innerWidth < 600) {
        camera.position.set(5.9, 5.1, 8.3);
    } else {
        camera.position.set(5.4, 4.6, 7.5);
    }

    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);
resize();

</script>
</body>
</html>
