<style>
/* =========================================
   1. PAGE SETUP

}

}

/* =========================================

========================================= */
#footnote {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 3%;
    width: 94%;
    transform: translateX(-50%);
    text-align: center;

#footnote.visible {

/* =========================================
   6. SMALL SCREENS
========================================= */
@media (max-width: 600px) {
    #button-area {
        bottom: 10%;
    }

    #solve-button {
        width: 132px;
        height: 82px;
        font-size: 11px;
    }

    #timer-panel {

</style>
</head>

<body>
<div id="stage">

    <div id="cube-canvas"></div>

    <div id="button-area">
        <button id="solve-button" type="button">
            START<br>SOLVING
        </button>

        <div id="timer-panel" aria-live="off">
            <div class="timer-labels">
                <span>DAYS</span>
                <span>HOURS</span>
                <span>MINUTES</span>
                <span>SECONDS</span>
            </div>

            <div class="timer-values">
                <span class="timer-number days" id="days">36500</span>
                <span class="timer-number" id="hours">00</span>
                <span class="timer-number" id="minutes">00</span>
                <span class="timer-number" id="seconds">00</span>
            </div>

            <div class="timer-brand">THE IMPOSSIBLE CUBE</div>
        </div>
    </div>

    <div id="footnote">
        Once the cube is solved you can proceed to the next page.
    </div>

</div>

<script>
/* =========================================
   7. THREE.JS SCENE
========================================= */
const canvasHost = document.getElementById("cube-canvas");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090a0d);

const camera = new THREE.PerspectiveCamera(
    36,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(5.4, 4.6, 7.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
canvasHost.appendChild(renderer.domElement);

/* =========================================
   8. NEUTRAL LIGHTING
   No yellow overhead spotlight.
   Balanced lighting makes the six colours vivid.
========================================= */

// General illumination across all visible cube faces.
scene.add(new THREE.AmbientLight(0xffffff, 1.65));

// Soft, neutral-white key light.
const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(4, 5, 6);
scene.add(keyLight);

// Front fill light reduces overly dark faces.
const frontFill = new THREE.DirectionalLight(0xffffff, 1.0);
frontFill.position.set(-4, 2, 5);
scene.add(frontFill);

// Cool blue rim light for separation from the background.
const blueFill = new THREE.PointLight(0x416bff, 10, 18);
blueFill.position.set(4, 1, -4);
scene.add(blueFill);

// Subtle neutral fill from the opposite side.
const neutralFill = new THREE.PointLight(0xffffff, 5, 16);
neutralFill.position.set(-5, 0, 2);
scene.add(neutralFill);

/* =========================================
   9. SIX CUBE COLOURS
   White, red, yellow, green, dark blue, orange
========================================= */
const FACE_COLORS = {
    right:  0xe92727, // Red
    left:   0xff791e, // Orange
    top:    0xffd92f, // Yellow
    bottom: 0xf5f0df, // White
    front:  0x153b9a, // Dark blue
    back:   0x16864b  // Green
};

function stickerMaterial(color) {
    return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.48,
        metalness: 0.015
    });
}

// Graphite casing between the stickers.
const innerMaterial = new THREE.MeshStandardMaterial({
    color: 0x30312f,
    roughness: 0.65,
    metalness: 0.025
});

const faceMaterials = [
    stickerMaterial(FACE_COLORS.right),
    stickerMaterial(FACE_COLORS.left),
    stickerMaterial(FACE_COLORS.top),
    stickerMaterial(FACE_COLORS.bottom),
    stickerMaterial(FACE_COLORS.front),
    stickerMaterial(FACE_COLORS.back)
];

/* =========================================
   10. BUILD THE CUBELET GRID
========================================= */
const cubies = [];
const spacing = 1.015;
const cubieSize = 0.965;

const cubeGeometry = new THREE.BoxGeometry(
    cubieSize, cubieSize, cubieSize
);

const edgeGeometry = new THREE.EdgesGeometry(cubeGeometry);
const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x11120f,
    transparent: true,
    opacity: 0.95
});

for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {

            const materials = [
                x === 1  ? faceMaterials[0] : innerMaterial,
                x === -1 ? faceMaterials[1] : innerMaterial,
                y === 1  ? faceMaterials[2] : innerMaterial,
                y === -1 ? faceMaterials[3] : innerMaterial,
                z === 1  ? faceMaterials[4] : innerMaterial,
                z === -1 ? faceMaterials[5] : innerMaterial
            ];

            const cubie = new THREE.Mesh(cubeGeometry, materials);

            cubie.position.set(
                x * spacing,
                y * spacing,
                z * spacing
            );

            cubie.userData.grid = { x, y, z };

            const edges = new THREE.LineSegments(
                edgeGeometry,
                edgeMaterial
            );

            cubie.add(edges);
            scene.add(cubie);
            cubies.push(cubie);
        }
    }
}

/* =========================================
   11. SHADOW UNDER THE CUBE
========================================= */
const shadowCanvas = document.createElement("canvas");
shadowCanvas.width = 256;
shadowCanvas.height = 256;

const shadowCtx = shadowCanvas.getContext("2d");
const shadowGradient = shadowCtx.createRadialGradient(
    128, 128, 8, 128, 128, 125
);

shadowGradient.addColorStop(0, "rgba(0,0,0,0.65)");
shadowGradient.addColorStop(0.45, "rgba(0,0,0,0.3)");
shadowGradient.addColorStop(1, "rgba(0,0,0,0)");

shadowCtx.fillStyle = shadowGradient;
shadowCtx.fillRect(0, 0, 256, 256);

const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 5),
    new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(shadowCanvas),
        transparent: true,
        depthWrite: false
    })
);

shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.9;
scene.add(shadow);

/* =========================================
   12. FACE-TURN ANIMATION ENGINE
========================================= */
const pivot = new THREE.Group();
scene.add(pivot);

let isTurning = false;
let activeTurn = null;
let moveQueue = [];
let solvingStarted = false;

const TURN_DURATION = 460;

function beginTurn(move, timestamp) {
    pivot.rotation.set(0, 0, 0);
    pivot.position.set(0, 0, 0);

    const selected = cubies.filter(cubie =>
        cubie.userData.grid[move.axis] === move.layer
    );

    selected.forEach(cubie => pivot.attach(cubie));

    activeTurn = {
        move,
        selected,
        start: timestamp,
        from: 0,
        to: move.direction * Math.PI / 2
    };

    isTurning = true;
}

function finishTurn() {
    activeTurn.selected.forEach(cubie => {
        scene.attach(cubie);

        const p = cubie.position;

        cubie.userData.grid = {
            x: Math.round(p.x / spacing),
            y: Math.round(p.y / spacing),
            z: Math.round(p.z / spacing)
        };

        cubie.position.set(
            cubie.userData.grid.x * spacing,
            cubie.userData.grid.y * spacing,
            cubie.userData.grid.z * spacing
        );

        const euler = new THREE.Euler().setFromQuaternion(
            cubie.quaternion, "XYZ"
        );

        euler.x = Math.round(euler.x / (Math.PI / 2)) * Math.PI / 2;
        euler.y = Math.round(euler.y / (Math.PI / 2)) * Math.PI / 2;
        euler.z = Math.round(euler.z / (Math.PI / 2)) * Math.PI / 2;

        cubie.quaternion.setFromEuler(euler);
    });

    pivot.rotation.set(0, 0, 0);
    activeTurn = null;
    isTurning = false;
}

function randomMove(previous = null) {
    const axes = ["x", "y", "z"];
    const layers = [-1, 0, 1];
    let move;

    do {
        move = {
            axis: axes[Math.floor(Math.random() * axes.length)],
            layer: layers[Math.floor(Math.random() * layers.length)],
            direction: Math.random() < 0.5 ? 1 : -1
        };
    } while (
        previous &&
        move.axis === previous.axis &&
        move.layer === previous.layer
    );

    return move;
}

function inverseMove(move) {
    return {
        axis: move.axis,
        layer: move.layer,
        direction: -move.direction
    };
}

/* =========================================
   13. START BUTTON
========================================= */
const button = document.getElementById("solve-button");
const timerPanel = document.getElementById("timer-panel");
const footnote = document.getElementById("footnote");

button.addEventListener("click", () => {
    if (solvingStarted) return;

    solvingStarted = true;
    button.classList.add("disappearing");

    setTimeout(() => {
        button.style.display = "none";
        timerPanel.classList.add("visible");
        footnote.classList.add("visible");
    }, 350);

    startCountdown();
    runAttempt();
});

/* =========================================
   14. 100-YEAR COUNTDOWN
========================================= */
let remainingSeconds = 36500 * 24 * 60 * 60;
let countdownInterval = null;

const daysElement = document.getElementById("days");
const hoursElement = document.getElementById("hours");
const minutesElement = document.getElementById("minutes");
const secondsElement = document.getElementById("seconds");

function renderCountdown() {
    daysElement.textContent = String(
        Math.floor(remainingSeconds / 86400)
    ).padStart(5, "0");

    hoursElement.textContent = String(
        Math.floor((remainingSeconds % 86400) / 3600)
    ).padStart(2, "0");

    minutesElement.textContent = String(
        Math.floor((remainingSeconds % 3600) / 60)
    ).padStart(2, "0");

    secondsElement.textContent = String(
        remainingSeconds % 60
    ).padStart(2, "0");
}

function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    remainingSeconds = 36500 * 24 * 60 * 60;
    renderCountdown();

    countdownInterval = setInterval(() => {
        if (remainingSeconds > 0) {
            remainingSeconds--;
            renderCountdown();
        } else {
            clearInterval(countdownInterval);
        }
    }, 1000);
}

// Reset when returning through browser history.
window.addEventListener("pageshow", event => {
    if (event.persisted) location.reload();
});

/* =========================================
   15. ENDLESS SOLVING ATTEMPTS
========================================= */
function runAttempt() {
    if (!solvingStarted) return;

    const scramble = [];
    let previous = null;

    for (let i = 0; i < 8; i++) {
        const move = randomMove(previous);
        scramble.push(move);
        previous = move;
    }

    scramble.forEach(move => moveQueue.push(move));

    const partialSolution = scramble
        .slice(0, -2)
        .reverse()
        .map(inverseMove);

    partialSolution.forEach(move => moveQueue.push(move));

    // Interrupt each attempt with new turns.
    moveQueue.push(randomMove());
    moveQueue.push(randomMove());

    waitForAttemptEnd();
}

function waitForAttemptEnd() {
    if (!solvingStarted) return;

    if (!isTurning && moveQueue.length === 0) {
        runAttempt();
    } else {
        requestAnimationFrame(waitForAttemptEnd);
    }
}

/* =========================================
   16. MAIN ANIMATION LOOP
========================================= */
function animate(timestamp) {
    requestAnimationFrame(animate);

    const time = timestamp * 0.001;

    if (!solvingStarted) {
        scene.rotation.y = Math.sin(time * 0.22) * 0.035;
    }

    if (!isTurning && moveQueue.length > 0) {
        beginTurn(moveQueue.shift(), timestamp);
    }

    if (activeTurn) {
        const elapsed = timestamp - activeTurn.start;
        const progress = Math.min(elapsed / TURN_DURATION, 1);

        const eased = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        pivot.rotation[activeTurn.move.axis] =
            activeTurn.from +
            (activeTurn.to - activeTurn.from) * eased;

        if (progress >= 1) {
            pivot.rotation[activeTurn.move.axis] =
                activeTurn.to;

            finishTurn();
        }
    }

    renderer.render(scene, camera);
}

requestAnimationFrame(animate);

/* =========================================
   17. RESPONSIVE CAMERA
========================================= */
function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;

    if (window.innerWidth < 600) {
        camera.position.set(5.9, 5.1, 8.3);
    } else {
        camera.position.set(5.4, 4.6, 7.5);
    }

    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);
resize();

</script>
</body>
</html>
