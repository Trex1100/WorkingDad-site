
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Impossible Cube</title>

  <!--
    THREE.JS IMPORT MAP
    Keep this inside <head>, before the module script.
    It fixes the "Failed to resolve module specifier 'three'" error.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #202432 0%, #0a0b10 68%, #030407 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* >>> EDIT HERE: Main heading */
    .heading {
      position: absolute;
      top: 3.5%;
      z-index: 2;
      width: 100%;
      padding: 0 12px;
      text-align: center;
      font-size: clamp(20px, 3.2vw, 36px);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.35),
        0 0 24px rgba(68, 126, 255, 0.5);
    }

    .subtitle {
      position: absolute;
      top: 10%;
      z-index: 2;
      padding: 0 14px;
      text-align: center;
      color: #aeb9d5;
      font-size: clamp(11px, 1.4vw, 14px);
      letter-spacing: 0.14em;
    }

    #cube-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #cube-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .controls {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      padding: 0 16px;
      pointer-events: none;
    }

    #start-button {
      pointer-events: auto;
      position: relative;
      border: 4px solid #8b0808;
      border-radius: 50%;
      width: clamp(145px, 19vw, 190px);
      height: clamp(145px, 19vw, 190px);
      padding: 12px;
      cursor: pointer;
      background:
        radial-gradient(circle at 35% 24%, #ff8585 0%, #ff2929 24%, #e00000 64%, #980000 100%);
      color: #fff;
      font-size: clamp(14px, 1.7vw, 18px);
      line-height: 1.4;
      font-weight: 1000;
      letter-spacing: 0.07em;
      text-shadow: 0 2px 3px #650000;
      box-shadow:
        0 12px 0 #650000,
        0 17px 24px rgba(0, 0, 0, 0.6),
        0 0 32px rgba(255, 0, 0, 0.22),
        inset 0 5px 9px rgba(255, 255, 255, 0.32),
        inset 0 -8px 12px rgba(0, 0, 0, 0.28);
      transition:
        transform 0.09s ease,
        box-shadow 0.09s ease,
        filter 0.2s ease;
    }

    #start-button:hover {
      filter: brightness(1.12);
    }

    #start-button:active {
      transform: translateY(9px) scale(0.98);
      box-shadow:
        0 3px 0 #650000,
        0 7px 12px rgba(0, 0, 0, 0.5),
        inset 0 5px 9px rgba(255, 255, 255, 0.22);
    }

    #start-button.hidden {
      display: none;
    }

    #timer {
      display: none;
      padding: 10px 17px;
      border: 1px solid rgba(91, 255, 175, 0.4);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.76);
      color: #72ffae;
      font-family: "Courier New", monospace;
      font-size: clamp(16px, 2.2vw, 23px);
      font-weight: bold;
      letter-spacing: 0.06em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      box-shadow:
        0 0 15px rgba(0, 255, 128, 0.12),
        inset 0 0 12px rgba(0, 255, 128, 0.05);
    }

    #timer.active {
      display: block;
    }

    #status {
      min-height: 17px;
      color: #b8c4df;
      font-size: 11px;
      letter-spacing: 0.13em;
      text-align: center;
      text-transform: uppercase;
    }

    .footnote {
      position: absolute;
      z-index: 3;
      bottom: 2.5%;
      left: 12px;
      right: 12px;
      text-align: center;
      color: #9da8bf;
      font-size: clamp(10px, 1.2vw, 12px);
      letter-spacing: 0.04em;
    }

    #error-message {
      display: none;
      position: absolute;
      z-index: 10;
      top: 45%;
      left: 8%;
      right: 8%;
      padding: 18px;
      border: 1px solid #ff6464;
      border-radius: 10px;
      background: #200d12;
      color: #fff;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-height: 650px) {
      .heading {
        top: 2%;
      }

      .subtitle {
        top: 9%;
      }

      .controls {
        bottom: 7%;
        gap: 10px;
      }

      #start-button {
        width: 125px;
        height: 125px;
        font-size: 13px;
      }

      .footnote {
        bottom: 1%;
      }
    }

    @media (max-width: 480px) {
      .heading {
        top: 4%;
        letter-spacing: 0.06em;
      }

      .subtitle {
        top: 10%;
        letter-spacing: 0.07em;
      }

      .controls {
        bottom: 10%;
      }

      #timer {
        letter-spacing: 0;
        padding: 9px 10px;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <div class="heading">The Impossible Cube</div>
    <div class="subtitle">27 PIECES · 6 COLOURS · INFINITE FRUSTRATION</div>

    <div id="cube-container"></div>

    <div id="error-message"></div>

    <div class="controls">
      <button id="start-button" type="button">
        START<br />SOLVING
      </button>

      <div id="timer" aria-live="off">100Y 000D 00:00:00</div>
      <div id="status">Waiting for your challenge...</div>
    </div>

    <div class="footnote">
      Once the cube is solved you can proceed to the next page.
    </div>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { RoundedBoxGeometry } from
      "three/addons/geometries/RoundedBoxGeometry.js";

    // =========================================================
    // >>> EDIT HERE: BASIC CUBE SETTINGS
    // =========================================================

    const CUBE_SIZE = 3;
    const SPACING = 1.02;
    const CUBIE_SIZE = 0.96;

    // Each colour is assigned to one face of the solved cube.
    const COLORS = {
      right:  0xff2020, // Red
      left:   0xff7900, // Orange
      top:    0xffffff, // White
      bottom: 0xffe600, // Yellow
      front:  0x00e84f, // Green
      back:   0x064bff  // Dark blue
    };

    const container = document.getElementById("cube-container");
    const startButton = document.getElementById("start-button");
    const timerElement = document.getElementById("timer");
    const statusElement = document.getElementById("status");
    const errorElement = document.getElementById("error-message");

    let scene;
    let camera;
    let renderer;
    let cubeGroup;
    let cubies = [];
    let activeTurn = null;
    let nextTurnAt = 0;
    let started = false;
    let startTime = 0;
    let timerFrame = 0;
    let elapsedTurns = 0;

    const clock = new THREE.Clock();

    // =========================================================
    // SCENE, CAMERA AND LIGHTING
    // =========================================================

    try {
      init();
      animate();
    } catch (error) {
      showError(error);
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090b12);

      camera = new THREE.PerspectiveCamera(
        36,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(5.8, 5.5, 8.2);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      container.appendChild(renderer.domElement);

      // Balanced lighting, without a harsh yellow spotlight.
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
      keyLight.position.set(5, 8, 7);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xb6ccff, 0.8);
      fillLight.position.set(-6, 2, -5);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
      rimLight.position.set(1, -4, 5);
      scene.add(rimLight);

      cubeGroup = new THREE.Group();
      scene.add(cubeGroup);

      createCube();

      window.addEventListener("resize", onResize);

      startButton.addEventListener("click", startChallenge);

      // A fresh page visit starts a fresh challenge.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          window.location.reload();
        }
      });
    }

    // =========================================================
    // CREATE THE 3 × 3 × 3 RUBIK'S CUBE
    // =========================================================

    function createCube() {
      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x101116,
        roughness: 0.31,
        metalness: 0.08
      });

      const stickerMaterials = {
        right: makeStickerMaterial(COLORS.right),
        left: makeStickerMaterial(COLORS.left),
        top: makeStickerMaterial(COLORS.top),
        bottom: makeStickerMaterial(COLORS.bottom),
        front: makeStickerMaterial(COLORS.front),
        back: makeStickerMaterial(COLORS.back)
      };

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const cubie = new THREE.Group();

            cubie.position.set(
              x * SPACING,
              y * SPACING,
              z * SPACING
            );

            cubie.userData.grid = { x, y, z };

            // Rounded dark cubie body.
            const bodyGeometry = new RoundedBoxGeometry(
              CUBIE_SIZE,
              CUBIE_SIZE,
              CUBIE_SIZE,
              4,
              0.075
            );

            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            cubie.add(body);

            const stickerSize = 0.755;
            const stickerDepth = 0.025;
            const stickerOffset = CUBIE_SIZE / 2 + 0.012;

            // Stickers are added only to the original outside faces.
            if (x === 1) {
              addSticker(
                cubie, stickerMaterials.right,
                stickerSize, stickerDepth,
                stickerOffset, 0, 0,
                0, Math.PI / 2, 0
              );
            }

            if (x === -1) {
              addSticker(
                cubie, stickerMaterials.left,
                stickerSize, stickerDepth,
                -stickerOffset, 0, 0,
                0, -Math.PI / 2, 0
              );
            }

            if (y === 1) {
              addSticker(
                cubie, stickerMaterials.top,
                stickerSize, stickerDepth,
                0, stickerOffset, 0,
                -Math.PI / 2, 0, 0
              );
            }

            if (y === -1) {
              addSticker(
                cubie, stickerMaterials.bottom,
                stickerSize, stickerDepth,
                0, -stickerOffset, 0,
                Math.PI / 2, 0, 0
              );
            }

            if (z === 1) {
              addSticker(
                cubie, stickerMaterials.front,
                stickerSize, stickerDepth,
                0, 0, stickerOffset,
                0, 0, 0
              );
            }

            if (z === -1) {
              addSticker(
                cubie, stickerMaterials.back,
                stickerSize, stickerDepth,
                0, 0, -stickerOffset,
                0, Math.PI, 0
              );
            }

            cubeGroup.add(cubie);
            cubies.push(cubie);
          }
        }
      }

      // A slight overall tilt makes the cube easier to read visually.
      cubeGroup.rotation.set(-0.13, 0.25, 0);
    }

    function makeStickerMaterial(color) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.28,
        metalness: 0.02,
        emissive: new THREE.Color(color),
        emissiveIntensity: 0.045
      });
    }

    function addSticker(
      parent,
      material,
      size,
      depth,
      x,
      y,
      z,
      rotationX,
      rotationY,
      rotationZ
    ) {
      const geometry = new RoundedBoxGeometry(
        size,
        size,
        depth,
        3,
        0.045
      );

      const sticker = new THREE.Mesh(geometry, material);

      sticker.position.set(x, y, z);
      sticker.rotation.set(rotationX, rotationY, rotationZ);

      sticker.castShadow = false;
      sticker.receiveShadow = true;

      parent.add(sticker);
    }

    // =========================================================
    // RANDOM LAYER TURNS
    // The cube keeps moving and never receives a solving routine.
    // =========================================================

    function beginRandomTurn(now) {
      if (activeTurn) return;

      const axes = ["x", "y", "z"];
      const axis = axes[Math.floor(Math.random() * axes.length)];
      const layer = Math.floor(Math.random() * 3) - 1;

      // Quarter turns only.
      const direction = Math.random() < 0.5 ? -1 : 1;
      const targetAngle = direction * Math.PI / 2;

      const pivot = new THREE.Group();
      const layerPosition = layer * SPACING;

      if (axis === "x") {
        pivot.position.set(layerPosition, 0, 0);
      } else if (axis === "y") {
        pivot.position.set(0, layerPosition, 0);
      } else {
        pivot.position.set(0, 0, layerPosition);
      }

      // Add the pivot under the cube group so turns respect the cube's
      // overall orientation.
      cubeGroup.add(pivot);
      pivot.position.set(
        axis === "x" ? layerPosition : 0,
        axis === "y" ? layerPosition : 0,
        axis === "z" ? layerPosition : 0
      );

      const selectedCubies = cubies.filter((cubie) => {
        const grid = cubie.userData.grid;
        return grid[axis] === layer;
      });

      // Preserve each cubie's world transform as it enters the pivot.
      selectedCubies.forEach((cubie) => {
        pivot.attach(cubie);
      });

      activeTurn = {
        pivot,
        selectedCubies,
        axis,
        targetAngle,
        progress: 0,
        duration: 420 + Math.random() * 180,
        startTime: now
      };
    }

    function updateTurn(now) {
      if (!activeTurn) {
        if (now >= nextTurnAt) {
          beginRandomTurn(now);
        }
        return;
      }

      const turn = activeTurn;
      const rawProgress = Math.min(
        1,
        (now - turn.startTime) / turn.duration
      );

      // Smooth but mechanical quarter-turn animation.
      const eased = rawProgress < 0.5
        ? 4 * rawProgress * rawProgress * rawProgress
        : 1 - Math.pow(-2 * rawProgress + 2, 3) / 2;

      turn.pivot.rotation[turn.axis] =
        turn.targetAngle * eased;

      if (rawProgress >= 1) {
        finishTurn(turn);
        activeTurn = null;
        elapsedTurns++;

        statusElement.textContent =
          started
            ? `Attempt ${elapsedTurns} · Still unsolved`
            : "The cube is getting nowhere...";

        // Short pause before the next turn.
        nextTurnAt = now + 100 + Math.random() * 180;
      }
    }

    function finishTurn(turn) {
      const pivot = turn.pivot;

      // Detach pieces back to the cube group, preserving world transforms.
      turn.selectedCubies.forEach((cubie) => {
        cubeGroup.attach(cubie);
      });

      cubeGroup.remove(pivot);

      // Remove tiny floating-point errors from positions and rotations.
      turn.selectedCubies.forEach((cubie) => {
        cubie.position.x = snapPosition(cubie.position.x);
        cubie.position.y = snapPosition(cubie.position.y);
        cubie.position.z = snapPosition(cubie.position.z);

        cubie.rotation.x = snapAngle(cubie.rotation.x);
        cubie.rotation.y = snapAngle(cubie.rotation.y);
        cubie.rotation.z = snapAngle(cubie.rotation.z);

        cubie.updateMatrix();
      });

      // Refresh logical grid coordinates for the next random layer turn.
      cubies.forEach((cubie) => {
        cubie.userData.grid = {
          x: Math.round(cubie.position.x / SPACING),
          y: Math.round(cubie.position.y / SPACING),
          z: Math.round(cubie.position.z / SPACING)
        };
      });
    }

    function snapPosition(value) {
      return Math.round(value / SPACING) * SPACING;
    }

    function snapAngle(value) {
      const quarterTurn = Math.PI / 2;
      return Math.round(value / quarterTurn) * quarterTurn;
    }

    // =========================================================
    // START BUTTON AND 100-YEAR COUNTDOWN
    // =========================================================

    function startChallenge() {
      if (started) return;

      started = true;
      startTime = Date.now();

      startButton.classList.add("hidden");
      timerElement.classList.add("active");

      statusElement.textContent = "Solving in progress · Good luck!";

      updateTimer();
      timerFrame = window.setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      const hundredYears = 100 * 365.25 * 24 * 60 * 60 * 1000;
      const remaining = Math.max(
        0,
        hundredYears - (Date.now() - startTime)
      );

      const totalSeconds = Math.floor(remaining / 1000);
      const years = Math.floor(totalSeconds / (365.25 * 24 * 3600));
      const afterYears = totalSeconds - Math.floor(
        years * 365.25 * 24 * 3600
      );

      const days = Math.floor(afterYears / 86400);
      const hours = Math.floor((afterYears % 86400) / 3600);
      const minutes = Math.floor((afterYears % 3600) / 60);
      const seconds = afterYears % 60;

      timerElement.textContent =
        `${String(years).padStart(3, "0")}Y ` +
        `${String(days).padStart(3, "0")}D ` +
        `${String(hours).padStart(2, "0")}:` +
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;

      if (remaining <= 0) {
        clearInterval(timerFrame);
        timerElement.textContent = "TIME IS UP!";
        statusElement.textContent =
          "Still unsolved. Truly impossible!";
      }
    }

    // =========================================================
    // MAIN ANIMATION LOOP
    // =========================================================

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const now = performance.now();

      // Slow, continuous whole-cube movement.
      cubeGroup.rotation.y += delta * 0.16;
      cubeGroup.rotation.x += delta * 0.035;

      updateTurn(now);

      renderer.render(scene, camera);
    }

    // =========================================================
    // RESIZE AND ERROR HANDLING
    // =========================================================

    function onResize() {
      if (!camera || !renderer) return;

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    function showError(error) {
      console.error("Cube initialization failed:", error);

      errorElement.style.display = "block";
      errorElement.innerHTML =
        "<strong>The cube could not load.</strong><br>" +
        "Check your internet connection and make sure this page is " +
        "running through VS Code Live Server, not file:///.<br>" +
        "<small>Open the browser console for the exact error.</small>";
    }
  </script>
</body>
</html>
