
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Cube</title>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    /* >>> EDIT HERE: Entire page background */
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000000;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 16px 22px;
      background: #000000;
    }

    /* Main heading */
    .heading {
      margin: 0;
      text-align: center;
      font-size: clamp(23px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-shadow: 0 0 16px rgba(130, 160, 255, 0.45);
    }

    /* >>> EDIT HERE: Cube size */
    #cube-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: clamp(390px, 59vh, 590px);
      flex: 0 0 auto;
      margin-top: 8px;
      background: transparent;
    }

    #cube-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 8px 0 20px;
      text-align: center;
      background: #000000;
    }

    /* Circular red START SOLVING button */
    #start-button {
      width: 154px;
      height: 154px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 5px solid #8e0808;
      padding: 12px;
      cursor: pointer;

      background:
        radial-gradient(
          circle at 32% 23%,
          #ff8b8b 0%,
          #ff3030 22%,
          #ec0808 55%,
          #a60000 100%
        );

      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.06em;
      text-shadow: 0 2px 3px #710000;

      box-shadow:
        0 10px 0 #650000,
        0 15px 22px rgba(0, 0, 0, 0.65),
        inset 0 5px 9px rgba(255, 255, 255, 0.28),
        inset 0 -7px 12px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        filter 0.2s ease;
    }

    #start-button:hover {
      filter: brightness(1.12);
    }

    #start-button:active {
      transform: translateY(8px) scale(0.98);
      box-shadow:
        0 2px 0 #650000,
        0 5px 10px rgba(0, 0, 0, 0.5),
        inset 0 4px 8px rgba(255, 255, 255, 0.2);
    }

    #start-button.hidden {
      display: none;
    }

    /* Hours : Minutes : Seconds label */
    #timer-heading {
      display: none;
      color: #ff5555;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.16em;
      text-align: center;
      text-shadow: 0 0 7px #ff0000;
    }

    #timer-heading.active {
      display: block;
    }

    /* Red digital countdown */
    #timer {
      display: none;
      max-width: 100%;
      padding: 13px 17px;
      border: 2px solid #681010;
      border-radius: 5px;
      background: #090303;

      color: #ff2929;
      font-family: "Courier New", monospace;
      font-size: clamp(23px, 4.5vw, 38px);
      font-weight: bold;
      letter-spacing: 0.07em;
      font-variant-numeric: tabular-nums;
      text-align: center;

      text-shadow:
        0 0 4px #ff0000,
        0 0 11px rgba(255, 0, 0, 0.8);

      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.12),
        inset 0 0 12px rgba(255, 0, 0, 0.06);
    }

    #timer.active {
      display: block;
    }

    #timer-label {
      display: none;
      color: #b9c1d3;
      font-size: 12px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    #timer-label.active {
      display: block;
    }

    #status {
      min-height: 17px;
      color: #b9c1d3;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .footnote {
      margin-top: 10px;
      padding: 0 8px;
      color: #a6afc4;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      background: #000000;
    }

    #error-message {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ff5555;
      border-radius: 8px;
      color: #ffffff;
      background: #240c10;
      text-align: center;
      line-height: 1.6;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      #app {
        padding: 23px 10px 18px;
      }

      .heading {
        letter-spacing: 0.055em;
      }

      #cube-container {
        height: 420px;
        margin-top: 5px;
      }

      #start-button {
        width: 140px;
        height: 140px;
        font-size: 15px;
      }

      #timer {
        padding: 12px 9px;
        letter-spacing: 0.02em;
      }

      #timer-heading {
        font-size: 10px;
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>

<body>
  <main id="app">

    <h1 class="heading">THE IMPOSSIBLE CUBE</h1>

    <div id="cube-container"></div>

    <div id="error-message"></div>

    <section class="controls">

      <button id="start-button" type="button">
        START<br>SOLVING
      </button>

      <div id="timer-heading">
        HOURS : MINUTES : SECONDS
      </div>

      <div id="timer">876600:00:00</div>

      <div id="timer-label">
        TIME LEFT TO SOLVE
      </div>

      <div id="status">
        WAITING FOR YOUR CHALLENGE...
      </div>

    </section>

    <footer class="footnote">
      Once the cube is solved you can proceed to the next page.
    </footer>

  </main>

  <script type="module">
    import * as THREE from "three";

    import {
      RoundedBoxGeometry
    } from "three/addons/geometries/RoundedBoxGeometry.js";


    // ========================================================
    // >>> EDIT HERE: CUBE SETTINGS
    // ========================================================

    const SPACING = 1.02;
    const CUBIE_SIZE = 0.96;

    const COLORS = [
      0xffffff, // White
      0xff2020, // Red
      0xffe600, // Yellow
      0x00e84f, // Green
      0x064bff, // Dark blue
      0xff7900  // Orange
    ];

    // 100 years, using an average year of 365.25 days.
    const TOTAL_HOURS = Math.floor(100 * 365.25 * 24);
    const TOTAL_SECONDS = TOTAL_HOURS * 3600;


    // Page elements
    const container = document.getElementById("cube-container");
    const startButton = document.getElementById("start-button");
    const timerHeading = document.getElementById("timer-heading");
    const timerElement = document.getElementById("timer");
    const timerLabel = document.getElementById("timer-label");
    const statusElement = document.getElementById("status");
    const errorElement = document.getElementById("error-message");


    // Scene variables
    let scene;
    let camera;
    let renderer;
    let cubeGroup;

    let cubies = [];
    let activeTurn = null;
    let nextTurnAt = 0;

    let started = false;
    let startTime = 0;
    let timerInterval = null;
    let attempts = 0;

    const clock = new THREE.Clock();


    // Initialize the cube
    try {
      init();
      animate();
    } catch (error) {
      showError(error);
    }


    // ========================================================
    // INITIALIZE THE SCENE
    // ========================================================

    function init() {

      // Transparent scene: the page's black background shows through.
      scene = new THREE.Scene();
      scene.background = null;

      camera = new THREE.PerspectiveCamera(
        36,
        container.clientWidth / container.clientHeight,
        0.1,
        100
      );

      // >>> EDIT HERE: Camera zoom
      // A closer camera makes the cube larger.
      camera.position.set(4.8, 4.6, 6.8);
      camera.lookAt(0, 0, 0);


      // Transparent WebGL canvas removes the rectangular background.
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );

      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      container.appendChild(renderer.domElement);


      // Lighting: neutral white light, no yellow spotlight.
      scene.add(
        new THREE.AmbientLight(0xffffff, 1.5)
      );

      const keyLight = new THREE.DirectionalLight(
        0xffffff,
        2.1
      );

      keyLight.position.set(5, 8, 7);
      scene.add(keyLight);


      const fillLight = new THREE.DirectionalLight(
        0xb6ccff,
        0.8
      );

      fillLight.position.set(-6, 2, -5);
      scene.add(fillLight);


      const rimLight = new THREE.DirectionalLight(
        0xffffff,
        1.0
      );

      rimLight.position.set(1, -4, 5);
      scene.add(rimLight);


      // Main cube group
      cubeGroup = new THREE.Group();
      scene.add(cubeGroup);

      createCube();

      // Give the cube a scrambled-looking arrangement immediately.
      scrambleInitialState(24);

      // Keep the smooth overall rotation.
      cubeGroup.rotation.set(-0.13, 0.25, 0);

      window.addEventListener("resize", onResize);
      startButton.addEventListener("click", startChallenge);

      // Reset if the browser restores this page from its back-forward cache.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          window.location.reload();
        }
      });
    }


    // ========================================================
    // CREATE THE 27 CUBIES
    // ========================================================

    function createCube() {

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x101116,
        roughness: 0.31,
        metalness: 0.08
      });

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {

            const cubie = new THREE.Group();

            cubie.position.set(
              x * SPACING,
              y * SPACING,
              z * SPACING
            );

            cubie.userData.grid = { x, y, z };

            // Rounded black cubie body
            const body = new THREE.Mesh(
              new RoundedBoxGeometry(
                CUBIE_SIZE,
                CUBIE_SIZE,
                CUBIE_SIZE,
                4,
                0.075
              ),
              bodyMaterial
            );

            cubie.add(body);

            const stickerSize = 0.755;
            const stickerDepth = 0.025;
            const offset = CUBIE_SIZE / 2 + 0.012;


            // Right face
            if (x === 1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                offset, 0, 0,
                0, Math.PI / 2, 0
              );
            }

            // Left face
            if (x === -1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                -offset, 0, 0,
                0, -Math.PI / 2, 0
              );
            }

            // Top face
            if (y === 1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                0, offset, 0,
                -Math.PI / 2, 0, 0
              );
            }

            // Bottom face
            if (y === -1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                0, -offset, 0,
                Math.PI / 2, 0, 0
              );
            }

            // Front face
            if (z === 1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                0, 0, offset,
                0, 0, 0
              );
            }

            // Back face
            if (z === -1) {
              addSticker(
                cubie, stickerSize, stickerDepth,
                0, 0, -offset,
                0, Math.PI, 0
              );
            }

            cubeGroup.add(cubie);
            cubies.push(cubie);
          }
        }
      }
    }


    // ========================================================
    // COLOURED ROUNDED STICKERS
    // ========================================================

    function addSticker(
      parent,
      size,
      depth,
      x,
      y,
      z,
      rx,
      ry,
      rz
    ) {

      const colour = COLORS[
        Math.floor(Math.random() * COLORS.length)
      ];

      const material = new THREE.MeshStandardMaterial({
        color: colour,
        roughness: 0.28,
        metalness: 0.02,
        emissive: new THREE.Color(colour),
        emissiveIntensity: 0.045
      });

      const sticker = new THREE.Mesh(
        new RoundedBoxGeometry(
          size,
          size,
          depth,
          3,
          0.045
        ),
        material
      );

      sticker.position.set(x, y, z);
      sticker.rotation.set(rx, ry, rz);

      parent.add(sticker);
    }


    // ========================================================
    // INITIAL RANDOM SCRAMBLE
    // ========================================================

    function scrambleInitialState(numberOfMoves) {

      const axes = ["x", "y", "z"];

      for (let i = 0; i < numberOfMoves; i++) {

        const axis = axes[
          Math.floor(Math.random() * axes.length)
        ];

        const layer = Math.floor(Math.random() * 3) - 1;

        const direction = Math.random() < 0.5 ? -1 : 1;

        const pivot = new THREE.Group();

        const coordinate = layer * SPACING;

        pivot.position.set(
          axis === "x" ? coordinate : 0,
          axis === "y" ? coordinate : 0,
          axis === "z" ? coordinate : 0
        );

        cubeGroup.add(pivot);

        const selected = cubies.filter(
          cubie => cubie.userData.grid[axis] === layer
        );

        selected.forEach(cubie => {
          pivot.attach(cubie);
        });

        pivot.rotation[axis] = direction * Math.PI / 2;

        // Apply the turn before displaying the initial cube.
        pivot.updateMatrixWorld(true);

        selected.forEach(cubie => {
          cubeGroup.attach(cubie);
        });

        cubeGroup.remove(pivot);

        selected.forEach(cubie => {
          cubie.position.x = snapPosition(cubie.position.x);
          cubie.position.y = snapPosition(cubie.position.y);
          cubie.position.z = snapPosition(cubie.position.z);

          cubie.rotation.x = snapAngle(cubie.rotation.x);
          cubie.rotation.y = snapAngle(cubie.rotation.y);
          cubie.rotation.z = snapAngle(cubie.rotation.z);
        });

        updateGridPositions();
      }
    }


    // ========================================================
    // CONTINUOUS RANDOM LAYER ROTATION
    // ========================================================

    function beginRandomTurn(now) {

      if (activeTurn) return;

      const axes = ["x", "y", "z"];

      const axis = axes[
        Math.floor(Math.random() * axes.length)
      ];

      const layer = Math.floor(Math.random() * 3) - 1;

      const direction = Math.random() < 0.5 ? -1 : 1;

      const pivot = new THREE.Group();

      const coordinate = layer * SPACING;

      pivot.position.set(
        axis === "x" ? coordinate : 0,
        axis === "y" ? coordinate : 0,
        axis === "z" ? coordinate : 0
      );

      cubeGroup.add(pivot);

      const selectedCubies = cubies.filter(
        cubie => cubie.userData.grid[axis] === layer
      );

      selectedCubies.forEach(cubie => {
        pivot.attach(cubie);
      });

      activeTurn = {
        pivot,
        selectedCubies,
        axis,
        targetAngle: direction * Math.PI / 2,
        startTime: now,
        duration: 420 + Math.random() * 180
      };
    }


    function updateTurn(now) {

      if (!activeTurn) {
        if (now >= nextTurnAt) {
          beginRandomTurn(now);
        }

        return;
      }

      const turn = activeTurn;

      const progress = Math.min(
        1,
        (now - turn.startTime) / turn.duration
      );

      // Smooth easing for each layer rotation.
      const eased = progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;

      turn.pivot.rotation[turn.axis] =
        turn.targetAngle * eased;


      if (progress >= 1) {

        turn.pivot.updateMatrixWorld(true);

        turn.selectedCubies.forEach(cubie => {
          cubeGroup.attach(cubie);
        });

        cubeGroup.remove(turn.pivot);

        turn.selectedCubies.forEach(cubie => {
          cubie.position.x = snapPosition(cubie.position.x);
          cubie.position.y = snapPosition(cubie.position.y);
          cubie.position.z = snapPosition(cubie.position.z);

          cubie.rotation.x = snapAngle(cubie.rotation.x);
          cubie.rotation.y = snapAngle(cubie.rotation.y);
          cubie.rotation.z = snapAngle(cubie.rotation.z);
        });

        updateGridPositions();

        activeTurn = null;
        attempts++;

        statusElement.textContent = `ATTEMPT ${attempts}`;

        nextTurnAt = now + 120 + Math.random() * 160;
      }
    }


    function updateGridPositions() {

      cubies.forEach(cubie => {
        cubie.userData.grid = {
          x: Math.round(cubie.position.x / SPACING),
          y: Math.round(cubie.position.y / SPACING),
          z: Math.round(cubie.position.z / SPACING)
        };
      });
    }


    function snapPosition(value) {
      return Math.round(value / SPACING) * SPACING;
    }


    function snapAngle(value) {
      return Math.round(value / (Math.PI / 2)) * (Math.PI / 2);
    }


    // ========================================================
    // START BUTTON AND 100-YEAR COUNTDOWN
    // ========================================================

    function startChallenge() {

      if (started) return;

      started = true;
      startTime = Date.now();

      // Remove the button after clicking.
      startButton.classList.add("hidden");

      // Reveal the labels and countdown.
      timerHeading.classList.add("active");
      timerElement.classList.add("active");
      timerLabel.classList.add("active");

      statusElement.textContent = "ATTEMPT 0";

      updateTimer();

      timerInterval = window.setInterval(updateTimer, 1000);
    }


    function updateTimer() {

      const elapsed = Math.floor(
        (Date.now() - startTime) / 1000
      );

      const remaining = Math.max(
        0,
        TOTAL_SECONDS - elapsed
      );

      const hours = Math.floor(remaining / 3600);

      const minutes = Math.floor(
        (remaining % 3600) / 60
      );

      const seconds = remaining % 60;

      timerElement.textContent =
        `${String(hours).padStart(6, "0")}:` +
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;

      if (remaining === 0) {
        clearInterval(timerInterval);

        timerElement.textContent = "000000:00:00";
        timerLabel.textContent = "TIME IS UP";
      }
    }


    // ========================================================
    // ANIMATION, RESIZE AND ERROR HANDLING
    // ========================================================

    function animate() {

      requestAnimationFrame(animate);

      if (!renderer) return;

      const delta = Math.min(clock.getDelta(), 0.05);
      const now = performance.now();

      // Keep the smooth overall rotation.
      cubeGroup.rotation.y += delta * 0.16;
      cubeGroup.rotation.x += delta * 0.035;

      updateTurn(now);

      renderer.render(scene, camera);
    }


    function onResize() {

      if (!camera || !renderer) return;

      const width = container.clientWidth;
      const height = container.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    }


    function showError(error) {

      console.error("Cube initialization failed:", error);

      errorElement.style.display = "block";

      errorElement.textContent =
        "The cube could not load. Check your internet connection " +
        "and the browser console for the exact error.";
    }
  </script>
</body>
</html>
