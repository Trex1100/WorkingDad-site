<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATH TO NEXUS</title>

    <!-- >>> FONT IMPORTS — EDIT HERE -->
    <style>
        @font-face {
            font-family: 'Algol';
            src: url('fonts/Algol.otf') format('opentype');
        }

        @font-face {
            font-family: 'DigitalGlitch';
            src: url('fonts/Digital Glitch Demo.otf') format('opentype');
        }

        /* >>> GLOBAL RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            position: relative;
            min-height: 100vh;
            color: #fff;
            background: #030000;
            font-family: 'Algol', sans-serif;
            overflow-x: hidden;
        }

        /* >>> NEXUS GIF BACKGROUND — EDIT HERE */
        .background-scene {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: #030000 url('./assets/NEXUS.gif') center center / 100% 100% no-repeat;
            pointer-events: none;
        }

        /* >>> DARK / RED COLOR ENHANCEMENT */
        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 0, 55, 0.04) 0%,
                    rgba(0, 0, 0, 0.12) 48%,
                    rgba(0, 0, 0, 0.48) 100%
                );

            backdrop-filter: saturate(1.3) contrast(1.08);
        }

        /* >>> MAIN PAGE LAYOUT */
        .page-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* >>> HEADER */
        .site-header {
            width: 100%;
            min-height: 90px;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(0, 0, 0, 0.45);
            border-bottom: 1px solid rgba(255, 0, 55, 0.35);
            box-shadow: 0 5px 25px rgba(255, 0, 40, 0.12);
        }

        .site-title {
            font-family: 'DigitalGlitch', sans-serif;
            font-size: clamp(20px, 3vw, 36px);
            color: #ff173d;
            letter-spacing: 3px;
            text-shadow:
                0 0 5px #ff002b,
                0 0 16px rgba(255, 0, 45, 0.75);
        }

        /* >>> NAVIGATION */
        .navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(12px, 2vw, 28px);
        }

        .navigation a {
            position: relative;
            color: #f4eaea;
            font-size: 13px;
            letter-spacing: 1px;
            text-decoration: none;
            transition: color 0.25s, text-shadow 0.25s;
        }

        .navigation a:hover {
            color: #ff2048;
            text-shadow: 0 0 10px #ff003c;
        }

        /* >>> ADMIN GIF */
        .admin-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 38px 20px 24px;
        }

        .admin-gif {
            display: block;
            width: clamp(100px, 16vw, 175px);
            height: auto;
            max-height: 220px;
            object-fit: contain;
            filter:
                drop-shadow(0 0 8px rgba(255, 0, 45, 0.65))
                drop-shadow(0 0 22px rgba(255, 0, 45, 0.3));
        }

        /* >>> EMPTY MIDDLE SECTION
           Intentionally left empty for your next instructions. */
        .middle-section {
            flex: 1;
            width: 100%;
            min-height: 280px;
            padding: 20px;
        }

        /* >>> FOOTER — COMPACT HEIGHT */
        .site-footer {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.72);
            border-top: 1px solid rgba(255, 0, 55, 0.4);
            box-shadow: 0 -4px 20px rgba(255, 0, 40, 0.12);
        }

        .site-footer p {
            color: rgba(255, 230, 235, 0.78);
            font-size: 11px;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* >>> CURSOR AURA */
        .cursor-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;

            background: radial-gradient(
                circle,
                rgba(255, 0, 45, 0.12) 0%,
                rgba(255, 0, 45, 0.06) 28%,
                rgba(255, 0, 45, 0) 72%
            );

            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        /* >>> CURSOR GLITCH FLASHES */
        .cursor-aura::before,
        .cursor-aura::after {
            content: "";
            position: absolute;
            inset: 12%;
            border: 1px solid rgba(255, 0, 55, 0.18);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .cursor-aura.glitch::before {
            animation: cursorGlitch 0.22s steps(2, end);
        }

        .cursor-aura.glitch::after {
            animation: cursorGlitch 0.28s steps(2, end) reverse;
        }

        @keyframes cursorGlitch {
            0% {
                opacity: 0.8;
                transform: translate(5px, -3px) scale(1.05);
            }
            40% {
                opacity: 0.35;
                transform: translate(-5px, 2px) scale(0.92);
            }
            100% {
                opacity: 0;
                transform: translate(0, 0) scale(1);
            }
        }

        /* >>> MOBILE RESPONSIVENESS */
        @media (max-width: 700px) {
            .site-header {
                flex-direction: column;
                justify-content: center;
                padding: 20px 14px;
                gap: 16px;
            }

            .navigation {
                gap: 14px 20px;
            }

            .navigation a {
                font-size: 12px;
            }

            .admin-section {
                padding: 28px 16px 18px;
            }

            .middle-section {
                min-height: 240px;
            }

            .site-footer {
                min-height: 42px;
                padding: 10px 12px;
            }

            .cursor-aura {
                width: 95px;
                height: 95px;
            }
        }

        /* >>> REDUCE MOTION FOR ACCESSIBILITY */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body>

    <!-- >>> BACKGROUND GIF -->
    <div class="background-scene"></div>
    <div class="background-overlay"></div>

    <div class="page-wrapper">

        <!-- >>> HEADER -->
        <header class="site-header">
            <h1 class="site-title">PATH TO NEXUS</h1>

            <nav class="navigation">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Rules &amp; Regulations</a>
                <a href="#">Support</a>
            </nav>
        </header>

        <!-- >>> ADMIN GIF -->
        <section class="admin-section">
            <img
                src="./assets/ADMIN.gif"
                alt="Admin"
                class="admin-gif"
            >
        </section>

        <!-- >>> MIDDLE SECTION
             Keep empty until the next design instructions. -->
        <main class="middle-section">
        </main>

        <!-- >>> FOOTER -->
        <footer class="site-footer">
            <p>PATH TO NEXUS &copy; 2026 — ALL RIGHTS RESERVED</p>
        </footer>

    </div>

    <!-- >>> CURSOR AURA ELEMENT -->
    <div class="cursor-aura" id="cursorAura"></div>

    <!-- >>> CURSOR GLITCH EFFECT — NO PARTICLE SYSTEM -->
    <script>
        const cursorAura = document.getElementById('cursorAura');

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let auraX = cursorX;
        let auraY = cursorY;

        document.addEventListener('mousemove', (event) => {
            cursorX = event.clientX;
            cursorY = event.clientY;
        });

        function animateCursorAura() {
            auraX += (cursorX - auraX) * 0.18;
            auraY += (cursorY - auraY) * 0.18;

            cursorAura.style.left = auraX + 'px';
            cursorAura.style.top = auraY + 'px';

            requestAnimationFrame(animateCursorAura);
        }

        animateCursorAura();

        /* >>> RANDOM GLITCH FLASHES */
        function triggerCursorGlitch() {
            if (Math.random() > 0.65) {
                cursorAura.classList.remove('glitch');

                /* Restart the CSS animation */
                void cursorAura.offsetWidth;

                cursorAura.classList.add('glitch');
            }

            setTimeout(triggerCursorGlitch, 700 + Math.random() * 1800);
        }

        triggerCursorGlitch();
    </script>

</body>
</html>
